<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Playoffs | Celtics</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f5;color:#153e2b;font:16px system-ui}header{background:#087342;color:white;padding:36px 20px}header a{color:white}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:36px;margin:4px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #9bc4ad;border-radius:10px;padding:12px;background:white;cursor:pointer;font-weight:bold}.tabs .active{background:#087342;color:white}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:white;border:1px solid #d4e3d9;border-radius:12px;padding:17px;margin:0 0 12px}.celtics{background:#e8f8ee;border:2px solid #149257}.meta{color:#5d7767;font-size:14px}.match{font-size:19px;font-weight:750;margin:9px 0}a{color:#087342}footer{text-align:center;padding:30px}</style><header><main><small>SBMSA • 6U Boys</small><h1>🏆 Gold Playoffs</h1><p>☘️ Following the <b>Celtics</b> · Pool A</p><a href="../">← Silver bracket</a></main></header><main><p>Official schedule • Playoff seeding is still TBD.</p><div class="tabs"><button class="active" data-tab="schedule">Pool Schedule</button><button data-tab="bracket">Playoff Bracket</button><button data-tab="standings">Pool Standings</button></div><section class="panel active" id="schedule"><h2>Pool-stage schedule</h2><div class="grid" id="games"></div></section><section class="panel" id="bracket"><h2>Championship bracket</h2><div class="grid" id="rounds"></div></section><section class="panel" id="standings"><h2>Pool standings</h2><div class="grid" id="pools"></div></section><p class="meta">Source: <a href="https://sbmsa.net/schedule/710226/6u-boys-gold-playoffs">Official SBMSA Gold schedule</a>. <span id="updated"></span></p></main><footer>☘️ GO CELTICS! ☘️</footer><script>const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});const name=s=>(s==='Celtics'?'☘️ ':'')+esc(s);fetch('./data/gold.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{el('updated').textContent='Data checked '+d.checked_at;el('games').innerHTML=d.games.map(g=>'<article class="card '+(g.home==='Celtics'||g.away==='Celtics'?'celtics':'')+'"><div class="meta">'+g.date+' · '+g.time+'</div><div class="match">'+name(g.home)+' vs '+name(g.away)+'</div>'+(g.score?'<b>Score: '+g.score.join('–')+'</b>':'<span class="meta">Awaiting result</span>')+'<p class="meta">'+g.field+'</p></article>').join('');el('rounds').innerHTML=d.playoffs.map(g=>'<article class="card"><b>Game '+g.id+'</b><div class="match">'+name(g.home)+' vs '+name(g.away)+'</div><div class="meta">'+g.date+' · '+g.time+' · '+g.field+'</div></article>').join('');el('pools').innerHTML=Object.entries(d.pools).map(([pool,teams])=>'<div><h3>Pool '+pool+'</h3>'+teams.map(t=>'<div class="card '+(t.name==='Celtics'?'celtics':'')+'"><b>'+name(t.name)+'</b><div class="meta">'+t.w+'W–'+t.l+'L–'+t.t+'T · GF '+t.gf+' · GA '+t.ga+'</div></div>').join('')+'</div>').join('')}).catch(()=>el('games').textContent='Schedule unavailable; please check SBMSA.');</script></html>
